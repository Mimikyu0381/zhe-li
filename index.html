<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#9A1D22" />
  <title>"浙"里在行动 · 平阳山门红色社会实践</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
      background: linear-gradient(135deg, #5F1115 0%, #C0272D 55%, #9A1D22 100%);
      color: #FBF3E7;
    }
    .entry { width: 100%; max-width: 420px; text-align: center; }
    h1 { margin: 0 0 12px; font-size: 34px; line-height: 1.4; letter-spacing: 4px; }
    p { margin: 0; font-size: 14px; line-height: 1.8; color: rgba(251, 243, 231, 0.82); }
    .links { display: flex; gap: 12px; margin-top: 26px; }
    .links a {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid rgba(246, 217, 143, 0.55);
      border-radius: 8px;
      color: #F6D98F;
      text-decoration: none;
      font-size: 15px;
      letter-spacing: 1px;
    }
    .links a.primary { background: #F6D98F; border-color: #F6D98F; color: #5F1115; font-weight: 700; }
  </style>
  <script>
    (function () {
      var ua = navigator.userAgent || "";
      var isMobile = /Android|iPhone|iPad|iPod|Mobile|Windows Phone/i.test(ua) ||
        window.matchMedia("(max-width: 820px)").matches;
      window.location.replace(isMobile ? "mobile/index.html" : "desktop/index.html");
    })();
  </script>
</head>
<body>
  <main class="entry">
    <h1>"浙"里在行动</h1>
    <p>正在进入平阳山门红色社会实践成果展示</p>
    <div class="links">
      <a class="primary" href="desktop/index.html">电脑端</a>
      <a href="mobile/index.html">移动端</a>
    </div>
  </main>
</body>
</html>
